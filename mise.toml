[tools]
python = "3.13.15"
node = "26.11.1"

[tasks.build]
description = "Build and package the native macOS emulator"
run = "python tools/build.py --standalone"

[tasks.test]
description = "Run CPU, input, image, and CLI regression tests"
run = "python -m unittest discover -s tests -p 'test_*.py' -v"

[tasks.stress]
description = "Boot firmware and randomly press every panel button for 30 seconds"
run = "python tests/stress.py"

[tasks.panel_smoke]
description = "Run headless firmware preset and panel button smoke tests"
run = "python tools/panel_smoke.py"

[tasks.speed]
description = "Measure firmware speed headless and windowed with audio"
run = "python tools/speed.py"

[tasks.build_wasm]
description = "Cross-build the headless emulator for WebAssembly (Emscripten)"
# The native build fetches the pinned QEMU source and build tools this reuses.
depends = ["build"]
# Both compilers are task-scoped: each puts its own clang on PATH, which would
# shadow Apple's for the native build. clang is the host C compiler Meson and
# QEMU's configure need for build-machine tools (listed first so it wins on PATH).
# emsdk is the WebAssembly compiler; the asdf plugin brings its own Python, where
# the vfox one needs the system's, too old on macOS.
tools = { clang = "23.1.2", "asdf:mise-plugins/mise-emsdk" = "4.0.10" }
env = { CC = "clang" }
run = "python tools/build_wasm.py"

[tasks.serve_web]
description = "Serve the WebAssembly emulator page locally"
depends = ["build_wasm"]
run = "python tools/serve_web.py"

[tasks.test_wasm]
description = "Check the WebAssembly build against the native emulator"
depends = ["build", "build_wasm"]
run = "node tests/wasm_boot.mjs"
